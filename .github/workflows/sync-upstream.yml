name: Sync Upstream

on:
  schedule:
    # Esegue ogni 6 ore
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/disposable-email-domains/disposable-email-domains.git
          git fetch upstream main
          git checkout main
          git merge upstream/main --ff-only
          git push origin main
